  <body>
    <main id="demo">
      <noscript>
        <h1>Bluebook</h1>
        <p>
          An FFGL effect that does to your clip what The X-Files' opening titles
          did to theirs: a stuttering step-printed picture, a zoom into a
          photograph until it's all grain, a face pulled long, a hand that
          glows, a torch in the dark, a cold teal grade and a caption that
          spells itself out. There's a crime drama's freeze-frame hit in there
          too, for when one press should stop the frame with a flash and drain
          it to black and white.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/bluebook">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/bluebook/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/bluebook">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
